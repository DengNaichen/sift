name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS Build & Test
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Documentation Links
        run: python3 scripts/check-doc-links.py

      - name: Run Swift Tests
        # Retina (2x) pixel snapshots require a Retina display; run unit + golden characterization suites on headless 1x runners.
        run: swift test --arch arm64 --skip SnapshotTests

      - name: Build Sift.app Bundle
        run: ./scripts/build-app.sh
