name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to build
        required: false
        default: main
        type: string
      release_tag:
        description: Release tag to publish, for example v0.1.0-rc1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build And Publish macOS Release
    runs-on: macos-26
    environment: production
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
      DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      NOTARY_PROFILE: sift-notary

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}
          fetch-depth: 0

      - name: Set Up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Tool Versions
        run: |
          xcodebuild -version
          swift --version
          gh --version

      - name: Import Developer ID Certificate
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          LOGIN_KEYCHAIN="$(security login-keychain -d user | tr -d '"')"

          if [[ -z "$DEVELOPER_ID_APPLICATION_P12_BASE64" ]]; then
            echo "Missing DEVELOPER_ID_APPLICATION_P12_BASE64 secret."
            exit 1
          fi

          if [[ -z "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" ]]; then
            echo "Missing DEVELOPER_ID_APPLICATION_P12_PASSWORD secret."
            exit 1
          fi

          echo "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$LOGIN_KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          echo "RUNNER_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Store Notarytool Credentials
        run: ./scripts/setup-notarytool-profile.sh

      - name: Resolve Release Metadata
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
            RELEASE_DRAFT=true
            RELEASE_PRERELEASE=true
            RELEASE_LATEST=false
            RELEASE_VERIFY_TAG=false
            RELEASE_TARGET="$(git rev-parse HEAD)"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_DRAFT=false
            RELEASE_VERIFY_TAG=true

            if [[ "$RELEASE_TAG" == *-* ]]; then
              RELEASE_PRERELEASE=true
              RELEASE_LATEST=false
            else
              RELEASE_PRERELEASE=false
              RELEASE_LATEST=true
            fi
          fi

          {
            echo "GITHUB_TAG=$RELEASE_TAG"
            echo "GITHUB_RELEASE_DRAFT=$RELEASE_DRAFT"
            echo "GITHUB_RELEASE_PRERELEASE=$RELEASE_PRERELEASE"
            echo "GITHUB_RELEASE_LATEST=$RELEASE_LATEST"
            echo "GITHUB_RELEASE_VERIFY_TAG=$RELEASE_VERIFY_TAG"
            if [[ -n "${RELEASE_TARGET:-}" ]]; then
              echo "GITHUB_RELEASE_TARGET=$RELEASE_TARGET"
            fi
          } >> "$GITHUB_ENV"

      - name: Build And Notarize Release DMG
        run: ./scripts/release-macos-github.sh

      - name: Prepare Release Artifact Payload
        if: always()
        run: |
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          RELEASE_DIR="dist/github-release/${TAG_NAME}"
          ARTIFACT_DIR="$RUNNER_TEMP/macos-release-${TAG_NAME}"

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          if compgen -G "$RELEASE_DIR/dmg/*.dmg" >/dev/null; then
            cp "$RELEASE_DIR"/dmg/*.dmg "$ARTIFACT_DIR"/
          fi

          for optional_file in \
            "$RELEASE_DIR/notary-submission.plist" \
            "$RELEASE_DIR/notary-log.json"; do
            if [[ -f "$optional_file" ]]; then
              cp "$optional_file" "$ARTIFACT_DIR"/
            fi
          done

          echo "RELEASE_ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        run: ./scripts/publish-github-release.sh

      - name: Upload Release Artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: macos-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          path: ${{ env.RELEASE_ARTIFACT_DIR }}
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Clean Up Temporary Keychain
        if: always()
        run: |
          if [[ -n "${RUNNER_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$RUNNER_KEYCHAIN_PATH" || true
          fi
